.xl-chrome-ext-recall-dialog__content {
  text-align: center;
  margin-top: 16px;
}

.xl-chrome-ext-recall-dialog__content p {
  padding: 0px;
  margin: 0px;

  color: var(--font-font-2, #565b66);
  font-family: Microsoft YaHei;
  font-size: 12px;
  font-style: normal;
  font-weight: 400;
  line-height: 24px;
  /* 200% */
}

.xl-chrome-ext-recall-dialog__content p.bold {
  color: var(--font-font-1, #212429);
  text-align: center;
  font-family: Microsoft YaHei;
  font-size: 16px;
  font-style: normal;
  font-weight: 700;
  line-height: 24px;
  /* 150% */
}

.xl-chrome-ext-recall-dialog__content p.error {
  color: var(--error-error, #ff4d4f);
  opacity: 0;
}

.xl-chrome-ext-recall-dialog__content p.error a {
  color: #3f85ff;
  cursor: pointer;
}

.xl-chrome-ext-recall-dialog__carouselItem {
  position: absolute;
  display: none;
  align-items: center;
  flex-direction: column;
}

.xl-chrome-ext-recall-dialog__footer {
  display: flex;
  margin-top: 16px;
  gap: 12px;
}

.xl-chrome-ext-recall-dialog__footer button {
  width: 120px;
  height: 40px;
  padding: 4px 12px;
  border-radius: var(--border-radius-m, 8px);
  border: 1px solid var(--border-border-2, #d8dade);
  background: #fff;
  cursor: pointer;
}

.xl-chrome-ext-recall-dialog__footer button.blue {
  color: #fff;
  background: #3f85ff;
}

.xl-chrome-toast {
  box-sizing: border-box;
  position: fixed;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid red;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  height: 42px;
  padding: 10px 16px 10px 14px;
  font-size: 14px;
  font-weight: 400;

  border-radius: 8px;
  border: 1px solid #d8dade;
  background: #fff;
  /* boxShadow 3 */
  box-shadow: 0px 2px 8px 0px rgba(0, 0, 0, 0.15);
  line-height: 22px;
  z-index: 2147483647 !important;
}

  width: 16px;
  height: 16px;

  background-repeat: no-repeat;
  background-size: 100%;

@keyframes shine {
  0% {
    opacity: 1;
    background-position: -100px 0;
  }

  50%,
  100% {
    opacity: 0.5;
    background-position: 320px 0;
  }
}

@keyframes spin {
  0% {
    transform: rotate(0deg);
  }

  100% {
    transform: rotate(360deg);

.xl-chrome-ext-recall-dialog__content {
  text-align: center;
  margin-top: 16px;
}

.xl-chrome-ext-recall-dialog__content p {
  padding: 0px;
  margin: 0px;

  color: var(--font-font-2, #565b66);
  font-family: Microsoft YaHei;
  font-size: 12px;
  font-style: normal;
  font-weight: 400;
  line-height: 24px;
  /* 200% */
}

.xl-chrome-ext-recall-dialog__content p.bold {
  color: var(--font-font-1, #212429);
  text-align: center;
  font-family: Microsoft YaHei;
  font-size: 16px;
  font-style: normal;
  font-weight: 700;
  line-height: 24px;
  /* 150% */
}

.xl-chrome-ext-recall-dialog__content p.error {
  color: var(--error-error, #ff4d4f);
  opacity: 0;
}

.xl-chrome-ext-recall-dialog__content p.error a {
  color: #3f85ff;
  cursor: pointer;
}

.xl-chrome-ext-recall-dialog__carouselItem {
  position: absolute;
  display: none;
  align-items: center;
  flex-direction: column;
}

.xl-chrome-ext-recall-dialog__footer {
  display: flex;
  margin-top: 16px;
  gap: 12px;
}

.xl-chrome-ext-recall-dialog__footer button {
  width: 120px;
  height: 40px;
  padding: 4px 12px;
  border-radius: var(--border-radius-m, 8px);
  border: 1px solid var(--border-border-2, #d8dade);
  background: #fff;
  cursor: pointer;
}

.xl-chrome-ext-recall-dialog__footer button.blue {
  color: #fff;
  background: #3f85ff;
}

.xl-chrome-toast {
  box-sizing: border-box;
  position: fixed;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid red;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  height: 42px;
  padding: 10px 16px 10px 14px;
  font-size: 14px;
  font-weight: 400;

  border-radius: 8px;
  border: 1px solid #d8dade;
  background: #fff;
  /* boxShadow 3 */
  box-shadow: 0px 2px 8px 0px rgba(0, 0, 0, 0.15);
  line-height: 22px;
  z-index: 2147483647 !important;
}

  width: 16px;
  height: 16px;

  background-repeat: no-repeat;
  background-size: 100%;

@keyframes shine {
  0% {
    opacity: 1;
    background-position: -100px 0;
  }

  50%,
  100% {
    opacity: 0.5;
    background-position: 320px 0;
  }
}

@keyframes spin {
  0% {
    transform: rotate(0deg);
  }

  100% {
    transform: rotate(360deg);
